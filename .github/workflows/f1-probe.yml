name: F1 COM probe
on:
  pull_request:
    branches: [diagnostics/windows-ci-f0]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore tests/Heimdall.App.Tests/Heimdall.App.Tests.csproj --locked-mode
      - run: dotnet test tests/Heimdall.App.Tests/Heimdall.App.Tests.csproj --no-restore --filter "FullyQualifiedName~NativeRead_ReturnsSFalseWhenEndOfStreamIsReached" --logger "trx;LogFileName=f1-probe.trx"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: f1-probe
          path: tests/Heimdall.App.Tests/TestResults/*.trx
          if-no-files-found: warn
